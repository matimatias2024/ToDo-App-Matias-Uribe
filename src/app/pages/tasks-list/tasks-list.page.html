<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>ToDo App</ion-title>
    <ion-button slot="end" fill="clear" (click)="goToCredits()">
      <ion-icon name="person"></ion-icon>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="safe-bottom">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="filters-container">
    <ion-segment [(ngModel)]="selectedCategory" (ionChange)="onCategoryChange()" scrollable="true">
      <ion-segment-button *ngFor="let category of categories" [value]="category">
        <ion-label>{{ category }}</ion-label>
      </ion-segment-button>
    </ion-segment>

    <ion-item>
      <ion-label>Prioridad:</ion-label>
      <ion-select [(ngModel)]="selectedPriority" (ionChange)="onPriorityChange()" placeholder="Todas">
        <ion-select-option *ngFor="let priority of priorities" [value]="priority">
          {{ priority }}
        </ion-select-option>
      </ion-select>
    </ion-item>
  </div>

  <div *ngIf="isLoading" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando tareas...</p>
  </div>

  <ion-list *ngIf="!isLoading">
    <div *ngIf="filteredTasks.length === 0" class="empty-state">
      <ion-icon name="checkmark" size="large"></ion-icon>
      <h2>No hay tareas</h2>
      <p>¡Crea tu primera tarea para comenzar!</p>
    </div>

    <ion-item-sliding *ngFor="let task of filteredTasks; trackBy: trackByTaskId">
      <ion-item>
        <ion-checkbox 
          slot="start" 
          [checked]="task.status === 'completada'"
          (ionChange)="toggleTaskStatus(task)">
        </ion-checkbox>
        
        <ion-label [class.completed]="task.status === 'completada'">
          <h2>{{ task.title }}</h2>
          <p *ngIf="task.description">{{ task.description }}</p>
          <div class="task-badges">
            <ion-badge [color]="getPriorityColor(task.priority)">{{ task.priority }}</ion-badge>
            <ion-badge [color]="getCategoryColor(task.category)">{{ task.category }}</ion-badge>
          </div>
        </ion-label>

        <ion-button slot="end" fill="clear" (click)="editTask(task)">
          <ion-icon name="create"></ion-icon>
        </ion-button>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="confirmDelete(task)">
          <ion-icon name="trash"></ion-icon>
          Eliminar
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="createTask()" color="primary">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-toast
    [isOpen]="showToast"
    [message]="toastMessage"
    duration="3000"
    (didDismiss)="showToast = false">
  </ion-toast>

  <ion-alert
    [isOpen]="showAlert"
    header="Confirmar eliminación"
    [message]="alertMessage"
    [buttons]="alertButtons">
  </ion-alert>
</ion-content>
