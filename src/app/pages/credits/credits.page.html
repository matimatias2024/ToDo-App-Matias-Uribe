<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tasks-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Créditos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding credits-center safe-bottom">
  <div class="logo-wrap" role="img" aria-label="Logo AIEP">
    <img src="assets/aiep-logo.png" alt="Logo AIEP" class="aiep-logo" onerror="this.src='assets/aiep-logo.svg';">
    <div class="credits-text">
      <h2>Créditos</h2>
      <p>Matías Uribe — AIEP 2025</p>
    </div>
  </div>
</ion-content>
